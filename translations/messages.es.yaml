plan3meses: "En este plan, puedes concurrir las veces semanales que quieras a nuestras instalaciones por 3 meses. Tienes acceso a todas las máquinas que quieras, y si quieres, puedes trabajar con tu propia rutina, pero te recomendamos que te anotes a una de las rutinas preparadas por nuestros entrenadores a cargo del gimnasio. "
plan6meses: "Tienes acceso a nuestras instalaciones y máquinas por 6 meses, posiblemente más económicamente rentable que el plan de 3 meses si sabes que quieres concurrir al gimnasio a largo plazo. "
plananual: "El plan más rentable económicamente, ya que tienes acceso a nuestras instalaciones todo el año, además de sesiones personalizadas con nuestro personal altamente capacitado. Además, te tendremos más en cuenta a la hora de agendar, así que no tendrás que preocuparte de que no haya lugar en lo que te quieres agendar. "